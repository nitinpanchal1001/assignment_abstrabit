# Keeps the Render free service awake.
#
# A free Render web service spins down after 15 minutes without traffic and
# takes about a minute to come back. For a reviewer opening the link cold that
# minute looks like a broken app, so this pings it on a schedule.
#
# This is within the free allowance, not a way around it: Render grants 750
# instance hours per month and a 31-day month is 744, so one service can stay
# up continuously and still fit.
#
# Set the repository variable API_URL (Settings -> Secrets and variables ->
# Actions -> Variables) to the Render service root, e.g.
# https://groundwork-api-4gsp.onrender.com — a variable rather than a secret,
# because it is a public hostname and secrets are masked in logs, which makes
# failures here impossible to read.
#
# Two caveats worth knowing. GitHub delays or drops scheduled runs when its
# queue is busy, so treat this as best-effort; and it disables schedules
# entirely after 60 days without repository activity. If the link has to be
# reliably warm for a review window, add a second pinger at cron-job.org
# (free, no card) rather than relying on this alone.

name: keep-warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL repository variable is not set — nothing to ping."
            exit 0
          fi

          # --max-time 90 covers a full cold start (~60s) with headroom.
          # /api/health touches no database, so this measures the process being
          # awake and nothing else.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$API_URL/api/health" || echo 000)

          echo "GET $API_URL/api/health -> $code"
          # A non-200 is reported but does not fail the workflow: a red cron
          # every ten minutes trains you to ignore it, and this job is not a
          # health monitor.
          [ "$code" = "200" ] || echo "::warning::API did not return 200 (got $code)"
