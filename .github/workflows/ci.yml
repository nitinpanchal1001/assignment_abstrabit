name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --frozen fails if uv.lock is out of date with pyproject.toml, so a
        # dependency added without relocking cannot pass CI.
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        # The suite is hermetic — tests/conftest.py supplies dummy settings and
        # nothing opens a socket, so no services are needed here. The live
        # isolation proof (scripts/isolation_test.py) needs a seeded cluster and
        # is run against the deployment, not in CI.
        run: uv run pytest -q

  frontend:
    name: Frontend (tsc + eslint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # BACKEND_URL is only read at request time and has a localhost default,
        # so the build needs no secrets. If that ever stops being true, the
        # build breaking here is the correct outcome.
        run: npm run build
